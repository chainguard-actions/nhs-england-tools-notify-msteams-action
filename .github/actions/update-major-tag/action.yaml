name: 'Update the floating major tag'
description: 'Use this action to update the floating major tag to point to the latest release when a new minor or patch release is published'
inputs:
  github_token:
    description: 'Token'
    required: true
  full_release_version:
    description: 'The new release version that was published'
    required: true
  major_release_version:
    description: 'The major version of the new release that was published'
    required: true
runs:
  using: 'composite'
  steps:
    - name: 'Mask GitHub token'
      shell: bash
      env:
        GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
      run: echo "::add-mask::$GITHUB_TOKEN_INPUT"
    - name: 'Update major tag'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        FULL_RELEASE_VERSION: ${{ inputs.full_release_version }}
        MAJOR_RELEASE_VERSION: ${{ inputs.major_release_version }}
        GITHUB_REPOSITORY_INPUT: ${{ github.repository }}
      run: |
        full_tag="v$FULL_RELEASE_VERSION"
        major_tag="v$MAJOR_RELEASE_VERSION"

        # Resolve the SHA the full semver tag points to
        tag_sha=$(gh api "repos/$GITHUB_REPOSITORY_INPUT/git/ref/tags/${full_tag}" --jq '.object.sha')

        # Delete existing major tag ref if present
        gh api --method DELETE "repos/$GITHUB_REPOSITORY_INPUT/git/refs/tags/${major_tag}" || true

        # Create the floating major tag pointing to the same SHA as the full semver tag. Marked as verified
        gh api --method POST "repos/$GITHUB_REPOSITORY_INPUT/git/refs" -f ref="refs/tags/${major_tag}" -f sha="${tag_sha}"
