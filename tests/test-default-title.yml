name: Test default message title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          teams-webhook-url: "https://example.webhook.office.com/webhookb2/fake-webhook-id"
          message-title: "GitHub Action Notification"
          message-text: "Testing with the default title value."
      - name: Assert action ran and completed (success or graceful failure on fake webhook)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with default title"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake webhook URL)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
