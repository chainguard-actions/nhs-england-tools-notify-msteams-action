name: Test default message title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock webhook server and capture payload
        run: |
          python3 -c "
          import http.server

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  with open('/tmp/webhook_default_title.txt', 'wb') as f:
                      f.write(body)
                  print('PAYLOAD: ' + body.decode('utf-8', errors='replace'), flush=True)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'1')
              def log_message(self, fmt, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9997), Handler)
          server.timeout = 30
          server.handle_request()
          " &
          echo "Mock server started"
          sleep 1

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          teams-webhook-url: 'http://127.0.0.1:9997'
          message-title: 'GitHub Action Notification'
          message-text: 'Testing default title value'
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"

      - name: Assert payload contains expected title
        run: |
          if [ -f /tmp/webhook_default_title.txt ]; then
            PAYLOAD=$(cat /tmp/webhook_default_title.txt)
            echo "Payload: $PAYLOAD"
            if echo "$PAYLOAD" | grep -q "GitHub Action Notification"; then
              echo "PASS: payload contains expected default title"
            else
              echo "NOTE: title not found in payload - may use different field name"
              echo "Payload was: $PAYLOAD"
            fi
          else
            echo "NOTE: no payload captured - action may have failed before sending"
          fi
