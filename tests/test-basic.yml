name: Test basic usage - required inputs only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock webhook server
        run: |
          python3 -c "
          import http.server, threading, json, sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  print('WEBHOOK_RECEIVED: ' + body.decode('utf-8', errors='replace'), flush=True)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'1')
              def log_message(self, fmt, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9999), Handler)
          server.timeout = 30
          server.handle_request()
          " &
          echo "Mock server started"
          sleep 1

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          teams-webhook-url: 'http://127.0.0.1:9999'
          message-title: 'Test Notification'
          message-text: 'This is a test message from act'
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should either succeed (mock server responded 200)
          # or fail gracefully - either way it should have attempted the call
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
