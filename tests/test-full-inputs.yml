name: Test full usage - all inputs including optional
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          teams-webhook-url: "https://example.webhook.office.com/webhookb2/fake-webhook-id"
          message-title: "Deployment Notification"
          message-text: "Deployment to production completed successfully."
          message-colour: "00FF00"
          link: "https://github.com/nhs-england-tools/notify-msteams-action"
      - name: Assert action ran and completed (success or graceful failure on fake webhook)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with all inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake webhook URL)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
